{# Description + Open Graph / Twitter card. The including base sets `page_title`. #}
<meta name="description" content="{{ site.description }}" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="{{ site.name }}" />
<meta property="og:title" content="{{ page_title }}" />
<meta property="og:description" content="{{ site.description }}" />
<meta property="og:url" content="{{ site.url }}{{ request.path }}" />
<meta property="og:image" content="{{ site.url }}{{ url_for('static', filename='img/avatar.jpeg') }}" />
<meta property="og:image:alt" content="Photo of {{ site.name }}" />
<meta name="twitter:card" content="summary" />
